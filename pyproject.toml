[project]
name = "pyrpckit"
version = "0.10.0"
description = "Decorator-driven, transport-agnostic JSON-RPC 2.0 protocols for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mathis Arends", email = "mathisarends27@gmail.com" }]
dependencies = [
    "pydantic>=2.11",
]

[project.optional-dependencies]
codegen = ["jinja2>=3.1"]
dishka = ["dishka>=1.7"]
fastapi = ["fastapi>=0.115"]

[project.scripts]
rpckit = "rpckit.codegen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rpckit"]

[dependency-groups]
dev = [
    "dishka>=1.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pyright==1.1.414",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.rpckit.typecheck]
min_completeness = 0.92

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-p", "no:asyncio", "-p", "pytest_asyncio.plugin"]

[tool.coverage.run]
source = ["rpckit"]
branch = true

[tool.coverage.report]
show_missing = true
